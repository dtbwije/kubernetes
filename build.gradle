import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
// Import task types
import com.bmuschko.gradle.docker.tasks.image.*

plugins {
	id 'org.springframework.boot' version '2.7.7'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
	id 'org.jetbrains.kotlin.jvm' version '1.6.21'
	id 'org.jetbrains.kotlin.plugin.spring' version '1.6.21'
	id 'com.bmuschko.docker-spring-boot-application' version '6.7.0'
}

group = 'org.kubernetes'
version = '1.0.1'
sourceCompatibility = '17'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Reactive web (Mono / Flux) and reactive Postgres access
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'

	// Reactive Kafka consumer (works against local Kafka and Azure Event Hubs' Kafka endpoint)
	implementation 'io.projectreactor.kafka:reactor-kafka:1.3.19'

	// Flyway runs migrations over JDBC at startup; the app itself never uses JDBC
	runtimeOnly 'org.flywaydb:flyway-core'
	runtimeOnly 'org.postgresql:postgresql'

	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
	implementation 'io.projectreactor.kotlin:reactor-kotlin-extensions'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
}

tasks.withType(KotlinCompile) {
	kotlinOptions {
		freeCompilerArgs = ['-Xjsr305=strict']
		jvmTarget = '17'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootJar') {
	launchScript()
}

// Only ship the runnable boot jar (keeps build/libs to a single jar for the Dockerfile)
tasks.named('jar') {
	enabled = false
}

tasks.named('dockerBuildImage') {

}

tasks.named('dockerPushImage') {

}

docker {
	springBootApplication {
		baseImage = 'eclipse-temurin:17-jre'
		ports = [8080,8081]
		images = ['dtbwije/kubernetes:1.0.3']
	}
}
