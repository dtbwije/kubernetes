database.host=${DB_HOST:localhost}
database.port=${DB_PORT:5432}
database.name=${DB_NAME:mobile-data}
spring.datasource.url=jdbc:postgresql://${database.host}:${database.port}/${database.name}
spring.datasource.username=${DB_USERNAME:hellokube}
spring.datasource.password=${DB_PASSWORD:}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health
app.kafka.mobile-data-topic=${MOBILE_DATA_TOPIC:mobile-data}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:mobile-data-processor}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}

