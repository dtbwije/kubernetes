# --- Database (R2DBC for the app, JDBC only for Flyway migrations) ---
database.host=${DB_HOST:localhost}
database.port=${DB_PORT:5432}
database.name=${DB_NAME:users-db}
database.username=${DB_USERNAME:hellokube}
database.password=${DB_PASSWORD:}
database.ssl-mode=${DB_SSL_MODE:disable}

spring.r2dbc.url=r2dbc:postgresql://${database.host}:${database.port}/${database.name}?sslMode=${database.ssl-mode}
spring.r2dbc.username=${database.username}
spring.r2dbc.password=${database.password}

spring.flyway.url=jdbc:postgresql://${database.host}:${database.port}/${database.name}?sslmode=${database.ssl-mode}
spring.flyway.user=${database.username}
spring.flyway.password=${database.password}

# --- Health ---
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,r2dbc
management.endpoints.web.exposure.include=health

# --- Kafka (same client locally and against Azure Event Hubs; see application-cloud.properties) ---
app.kafka.enabled=${KAFKA_ENABLED:true}
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topic=${USER_EVENTS_TOPIC:user-events}
app.kafka.group-id=${KAFKA_CONSUMER_GROUP_ID:user-event-processor}
