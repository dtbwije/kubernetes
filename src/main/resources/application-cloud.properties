# Used when deployed to Azure (SPRING_PROFILES_ACTIVE=cloud).
# Azure Database for PostgreSQL requires TLS.
database.host=${DB_HOST}
database.name=${DB_NAME}
database.username=${DB_USERNAME}
database.password=${DB_PASSWORD}
database.ssl-mode=${DB_SSL_MODE:require}

# Azure Event Hubs exposes a Kafka-compatible endpoint on port 9093, so the same consumer code works.
# The Kafka "topic" is the Event Hub name; the Kafka consumer group is an Event Hubs consumer group.
app.kafka.bootstrap-servers=${EVENTHUBS_NAMESPACE}.servicebus.windows.net:9093
app.kafka.topic=${EVENTHUBS_NAME:user-events}
app.kafka.properties.security.protocol=SASL_SSL
app.kafka.properties.sasl.mechanism=PLAIN
app.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${EVENTHUBS_CONNECTION_STRING}";
